        let loadedCount = 0;
        const loader = document.getElementById('global-loader');
        const progressBar = document.getElementById('loader-progress');

        criticalImages.forEach(src => {
            const img = new Image();
            img.src = src;
            img.onload = img.onerror = () => {
                loadedCount++;
                const progress = (loadedCount / criticalImages.length) * 100;
                progressBar.style.width = progress + '%';
                
                if (loadedCount === criticalImages.length) {
                    setTimeout(() => {
                        loader.classList.add('fade-out');
                    }, 500);
                }
            };
        });

        // Fallback: hide loader after 5 seconds anyway
        setTimeout(() => {
            loader.classList.add('fade-out');
        }, 5000);

        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence, useScroll, useTransform, useSpring } = FramerMotion;

        // --- Image Cache System (IndexedDB) ---
        const DB_NAME = 'PortfolioImageCache';
        const STORE_NAME = 'images';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        };

        const getCachedImage = async (url) => {
            try {
                const db = await initDB();
                return new Promise((resolve) => {
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.get(url);
                    request.onsuccess = async () => {
                        if (request.result) {
                            resolve(URL.createObjectURL(request.result));
                        } else {
                            // Not in cache, fetch and store
                            try {
                                const response = await fetch(url);
                                const blob = await response.blob();
                                const writeTx = db.transaction(STORE_NAME, 'readwrite');
                                writeTx.objectStore(STORE_NAME).put(blob, url);
                                resolve(URL.createObjectURL(blob));
                            } catch (err) {
                                resolve(url); // Fallback to original URL
                            }
                        }
                    };
                    request.onerror = () => resolve(url);
                });
            } catch (e) {
                return url;
            }
        };

        // --- Components ---

        const CachedImage = ({ src, alt, className, ...props }) => {
            const [displaySrc, setDisplaySrc] = useState('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'); // transparent pixel
            const [isLoaded, setIsLoaded] = useState(false);

            useEffect(() => {
                let isMounted = true;
                getCachedImage(src).then(url => {
                    if (isMounted) setDisplaySrc(url);
                });
                return () => { isMounted = false; };
            }, [src]);

            return (
                <div className={`relative overflow-hidden bg-gray-100 ${className}`}>
                    <img
                        src={displaySrc}
                        alt={alt}
                        onLoad={() => setIsLoaded(true)}
                        className={`w-full h-full object-cover transition-opacity duration-700 ${isLoaded ? 'opacity-100' : 'opacity-0'}`}
                        {...props}
                    />
                    {!isLoaded && (
                        <div className="absolute inset-0 flex items-center justify-center">
                            <div className="w-6 h-6 border-2 border-ink/10 border-t-ink rounded-full animate-spin" />
                        </div>
                    )}
                </div>
            );
        };
